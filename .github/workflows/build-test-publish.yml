name: Build, test & publish image

# Builds the image, boots it in a smoke test and only pushes to Docker Hub if the
# server actually starts.
#   main            -> :<SERVER_VERSION> and :latest   (what Unraid users get)
#   any other branch -> :<branch-name> only            (safe for testing)
on:
  push:
    branches: [main]
    paths-ignore: ["**.md", ".github/workflows/update-pack.yml", ".github/workflows/rollback.yml"]
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: Git ref/sha to build (defaults to the triggering commit)
        type: string
        default: ""
      force_fail:
        description: Make the smoke test fail on purpose (tests the failure path)
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build-test-publish:
    runs-on: ubuntu-latest   # public repos: 4 vCPU / 16 GB RAM
    timeout-minutes: 60
    steps:
      - name: Check out
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Read pack.env
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          BRANCH: ${{ github.ref_name }}
        run: |
          set -a; source pack.env; set +a
          image="${DOCKERHUB_USERNAME}/${IMAGE_NAME}"
          if [[ "$BRANCH" == "main" ]]; then
            tags="${image}:${SERVER_VERSION} ${image}:latest"
          else
            tags="${image}:${BRANCH//\//-}"
          fi
          {
            echo "IMAGE=${image}"
            echo "SERVER_VERSION=${SERVER_VERSION}"
            echo "PUSH_TAGS=${tags}"
          } >> "$GITHUB_ENV"
          echo "### 🐳 ${PACK_NAME} ${SERVER_VERSION}" >> "$GITHUB_STEP_SUMMARY"
          echo "Will publish: \`${tags}\` (if the smoke test passes)" >> "$GITHUB_STEP_SUMMARY"

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          push: false
          tags: smoke-test:local
          labels: |
            org.opencontainers.image.version=${{ env.SERVER_VERSION }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ inputs.ref || github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test (boot the server)
        run: bash .github/scripts/smoke-test.sh smoke-test:local ${{ (inputs.force_fail || contains(github.event.head_commit.message, '[smoke-fail]')) && 'force-fail' || '' }}

      - name: Upload server log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-log
          path: smoke.log
          if-no-files-found: ignore
          retention-days: 14

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push tested image
        run: |
          for t in $PUSH_TAGS; do
            docker tag smoke-test:local "$t"
            docker push "$t"
            echo "- pushed \`$t\`" >> "$GITHUB_STEP_SUMMARY"
          done
